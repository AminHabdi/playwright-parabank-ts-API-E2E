name: Playwright Tests (ParaBank)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'  

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers and Dependencies
      run: npx playwright install --with-deps

    - name: Start ParaBank Docker Container
      run: |
         docker run -d --name parabank-app -p 8080:8080 parasoft/parabank
         echo "Wait, till Tomcat/Parabank start"
         sleep 15

    - name: Run Playwright tests with Sharding
      run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30